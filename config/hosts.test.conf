# Hostliste für den automatisierten Integrationstest (tests/integration.sh).
# Nicht ändern, ohne die erwarteten Ergebnisse im Test anzupassen!

# Positivtest: der Container selbst ist immer erreichbar → ONLINE
test-localhost    127.0.0.1

# Negativtest: 192.0.2.0/24 ist "TEST-NET-1" (RFC 5737) und wird nie geroutet → OFFLINE
test-unreachable  192.0.2.1

# Ungültiger Eintrag (Oktett > 255) → muss übersprungen werden
test-invalid      999.1.1.1
